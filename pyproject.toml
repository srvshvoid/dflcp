[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedforge"
version = "0.2.0"
description = "A research and course project demonstrating federated learning on CIFAKE with Byzantine attacks and robust defenses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "FedForge contributors" },
]
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "pydantic>=2.0.0",
  "numpy>=1.24.0",
  "pillow>=9.5.0",
  "scikit-learn>=1.2.0",
  "requests>=2.28.0",
  "websockets>=11.0",
  "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "httpx>=0.24.0",
]

[project.scripts]
fedforge = "fedforge.simulator:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["fedforge*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
